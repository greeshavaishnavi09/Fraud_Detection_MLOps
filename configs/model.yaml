
# Fraud Detection Model Configuration

project:
  name: fraud-detection-mlops
  random_state: 42

data:
  target_column: isFraud
  train_path: data/processed/splits/train.csv
  validation_path: data/processed/splits/validation.csv
  test_path: data/processed/splits/test.csv

features:
  numerical:
    - step
    - amount
    - oldbalanceOrg
  categorical:
    - type

training:
  sample_size: 500000
  test_size: 0.15
  validation_size: 0.15

models:
  logistic_regression:
    class_weight: balanced
    max_iter: 300

  random_forest:
    n_estimators: 100
    class_weight: balanced_subsample
    min_samples_leaf: 2
    n_jobs: -1

  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: auto
    eval_metric: aucpr
    tree_method: hist
    n_jobs: -1

selection:
  candidate_model: xgboost
  model_artifact: models/candidates/xgboost.joblib
  threshold: 0.97
  threshold_selection_metric: f1_score

evaluation:
  primary_metric: average_precision
  report_metrics:
    - precision
    - recall
    - f1_score
    - f2_score
    - average_precision
    - roc_auc
